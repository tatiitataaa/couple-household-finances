<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared: budgeting for two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Built-in model, written by source/export_model.py. Sets window.SHARED_MODEL. -->
<script src="model.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#0E1116; --muted:#6B7280; --faint:#9CA3AF; --line:#E8EAEF;
  --you:#5B5BF6; --you-soft:#ECECFE;
  --shared:#14B88A; --shared-soft:#E2F7F0;
  --partner:#F59E0B; --partner-soft:#FEF3DC;
  --warn:#F97316; --warn-soft:#FFEEDF;
  --hero-1:#16182F; --hero-2:#2A2464;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#000000; --surface:#151518; --surface-2:#1E1E22; --ink:#F4F5F7; --muted:#9A9DA6; --faint:#6B6E77; --line:#26262B;
    --you:#8686FF; --you-soft:#24244A;
    --shared:#2FD6A3; --shared-soft:#113A2F;
    --partner:#FBBF24; --partner-soft:#3B2E10;
    --warn:#FB923C; --warn-soft:#3A2412;
    --hero-1:#1A1B33; --hero-2:#30287A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000; --surface:#151518; --surface-2:#1E1E22; --ink:#F4F5F7; --muted:#9A9DA6; --faint:#6B6E77; --line:#26262B;
  --you:#8686FF; --you-soft:#24244A;
  --shared:#2FD6A3; --shared-soft:#113A2F;
  --partner:#FBBF24; --partner-soft:#3B2E10;
  --warn:#FB923C; --warn-soft:#3A2412;
  --hero-1:#1A1B33; --hero-2:#30287A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top, 0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:440px;margin:0 auto;padding:0 16px 104px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:6;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.people{display:flex;align-items:center;gap:6px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid transparent;background:var(--surface);color:var(--muted);transition:transform .15s}
.av[aria-pressed="true"]{border-color:var(--ink);color:#fff}
.av.me[aria-pressed="true"]{background:var(--you)}
.av.partner[aria-pressed="true"]{background:var(--partner)}
.av[aria-pressed="false"]{opacity:.7}
.people .viewing{font-size:13px;color:var(--muted);margin-left:4px}
.monthpill{display:flex;align-items:center;background:var(--surface);border-radius:999px;padding:2px;font-weight:600;font-size:14px}
.monthpill button{border:0;background:none;width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.monthpill button:disabled{opacity:.25;cursor:default}
.monthpill span{padding:0 4px;min-width:72px;text-align:center}
.pagetitle{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-0.025em;margin:6px 0 14px}

/* hero card */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%, var(--hero-2) 0%, var(--hero-1) 62%)}
.hero .k{font-size:13px;color:rgba(255,255,255,.66);font-weight:500}
.hero .big{font-family:var(--font-display);font-size:46px;font-weight:800;letter-spacing:-0.035em;line-height:1.05;margin:4px 0 6px}
.hero .big .cents{font-size:24px;opacity:.6;letter-spacing:-0.01em}
.hero .sub{font-size:14px;color:rgba(255,255,255,.78);max-width:34ch}
.seg{display:flex;height:8px;margin:18px 0 10px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.12)}
.seg span{height:100%}
.seg span + span{box-shadow:inset 2px 0 0 rgba(22,24,47,.55)}
.hero .leg{display:flex;justify-content:space-between;font-size:13px}
.hero .eq{display:flex;align-items:flex-start;gap:14px;margin-top:14px}
.hero .eq .part b{display:block;font-size:19px;font-weight:700;color:#fff;letter-spacing:-0.01em}
.hero .eq .part span{font-size:12px;color:rgba(255,255,255,.7)}
.hero .eq .op{font-size:20px;font-weight:300;color:rgba(255,255,255,.5);line-height:1.2}
.hero .seg + .sub{margin-top:2px}
.hero .leg b{display:block;font-size:16px;font-weight:700;color:#fff;margin-top:2px}
.hero .leg span{color:rgba(255,255,255,.66)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.banner{margin-top:12px;background:var(--surface);border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px}
.banner .ic{width:34px;height:34px;border-radius:10px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex:none}
.banner .tx{flex:1;font-size:14px}
.banner .tx b{display:block;font-weight:600}
.banner .tx span{color:var(--muted);font-size:13px}
.pillbtn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}

/* sections */
.sec{margin-top:26px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sechead h2{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-0.015em;margin:0}
.sechead span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border-radius:20px;padding:6px 16px}

/* settle */
.settle .who2{display:flex;align-items:center;gap:12px;padding:14px 0}
.settle button.who2{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;cursor:pointer;color:var(--ink)}
.settle button.who2:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:10px}
.settle .who2 .chev{color:var(--faint);flex:none;display:grid;place-items:center}
.paylist{list-style:none;margin:12px 0 0;padding:0;max-height:52vh;overflow-y:auto}
.paylist li{display:flex;align-items:center;gap:12px;padding:10px 0}
.paylist li + li{border-top:1px solid var(--line)}
.paylist .mid{flex:1;min-width:0}
.paylist .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paylist .sm{font-size:12px;color:var(--muted)}
.setbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.setbtn[aria-pressed="true"]{background:var(--shared-soft);border-color:transparent;color:var(--shared)}

.settle .who2 + .who2{border-top:1px solid var(--line)}
.settle .mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.settle .who2 .t{flex:1;font-size:14px}
.settle .who2 .t small{display:block;color:var(--muted);font-size:12px}
.settle .who2 .v{font-weight:600}
.settle .result{margin:0 -16px -6px;padding:14px 16px;border-radius:0 0 20px 20px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center}
.settle .result .t{font-size:13px;color:var(--muted)}
.settle .result .t b{display:block;color:var(--ink);font-size:16px;font-weight:700}
.settle .result .v{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-0.02em}

/* split tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px}
.tile .t{font-size:13px;color:var(--muted);display:flex;align-items:center}
.tile .v{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-top:4px}
.tile .p{font-size:12px;color:var(--faint)}

/* category rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 0}
.row + .row{border-top:1px solid var(--line)}
.catrow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;cursor:pointer;color:var(--ink)}
.catrow:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:10px}
.catrow .chev{color:var(--faint);flex:none}
.cic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.cic svg{width:19px;height:19px}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.row .sm{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between}
.thin{display:flex;height:4px;margin-top:7px;border-radius:2px;overflow:hidden}
.thin span{height:100%}

/* chart */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chartbox{background:var(--surface);border-radius:20px;padding:16px 14px 10px}
.chartbox svg{width:100%;height:auto;display:block}
.chartleg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:8px 2px 0}

/* review */
.deck{position:relative;display:grid;margin-top:6px}
.card{position:relative;grid-area:1/1;min-height:350px;min-width:0;box-sizing:border-box;background:var(--surface);border-radius:28px;padding:24px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.top{cursor:grab;box-shadow:0 18px 40px -22px rgba(14,17,22,.35)}
.card.under{transform:scale(.94) translateY(16px);opacity:.55}
.card .logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff}
.card .merchant{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-top:20px;line-height:1.1}
.card .meta{color:var(--muted);font-size:14px;margin-top:4px}
.catchip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:12px;border:0;background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;color:var(--ink)}
.catchip .cic{width:28px;height:28px;border-radius:50%}
.catchip .cic svg{width:15px;height:15px}
.catchip > svg{color:var(--muted)}
#topcard .logo, .card.under .logo, #topcard .catchip, .card.under .catchip{align-self:center}
#topcard .merchant, #topcard .meta, #topcard .amount, .card.under .merchant, .card.under .meta, .card.under .amount{text-align:center}
.catlist{list-style:none;margin:6px 0 0;padding:0}
.catlist button{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:9px 0;cursor:pointer;font-weight:500;box-sizing:border-box}
.catlist button:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:10px}
.catlist li + li button{border-top:1px solid var(--line)}
.catlist .ck{margin-left:auto;color:var(--you)}
.allrow{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14px;color:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:2px}
.preview{margin-top:10px;font-size:13px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:9px 12px}
.outcomes{list-style:none;margin:12px 0 0;padding:0;font-size:13px}
.outcomes li{display:flex;align-items:center;gap:10px;padding:5px 0}
.outcomes i{width:10px;height:10px;border-radius:50%;flex:none}
.outcomes span{color:var(--muted);width:88px;flex:none}
.outcomes b{font-weight:600}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--shared)}
.switch:checked::after{transform:translateX(20px)}
.nmbtn{all:unset;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;cursor:pointer}
.nmbtn:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:6px}
.minichip{display:inline-flex;align-items:center;gap:4px;margin-top:3px;border:0;background:var(--surface-2);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500;color:var(--muted)}
.newcat{display:flex;gap:8px;margin:8px 0 6px}
.newcat input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.newcat input:focus{outline:2px solid var(--you);outline-offset:0}
.allrow input{width:20px;height:20px;accent-color:var(--you);margin:0}
.card .amount{font-family:var(--font-display);font-size:48px;font-weight:800;letter-spacing:-0.035em;margin-top:14px}
.card .gauge{margin-top:auto}
#topcard, .card.under{justify-content:center}
#topcard .gauge, .card.under .gauge{margin-top:28px;width:100%}
#topcard .reasons, .card.under .reasons{justify-content:center}
.card .gauge .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.card .gauge .lab b{color:var(--ink)}
.track{height:6px;border-radius:3px;background:var(--you-soft);overflow:hidden}
.track span{display:block;height:100%;border-radius:3px;background:var(--shared)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.reasons span{max-width:100%;overflow-wrap:anywhere;text-align:center;line-height:1.35;font-size:12px;background:var(--surface-2);border-radius:999px;padding:5px 10px;color:var(--muted)}
.stamp{position:absolute;top:24px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;color:#fff}
.stamp.sh{right:24px;background:var(--shared)}
.stamp.so{left:24px;background:var(--you)}
.decide{display:flex;justify-content:center;gap:28px;margin-top:22px}
.decide button{border:0;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.decide .circ{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 6px 18px -10px rgba(14,17,22,.35)}
.decide .circ svg{width:26px;height:26px}
.decide .so .circ{color:var(--you)}
.decide .sh .circ{background:var(--shared);color:#fff}
.progress{font-size:13px;color:var(--muted);margin:-6px 4px 0}
.skiprow{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 0}
.skiprow .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.navbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.navbtn:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;background:var(--shared-soft);color:var(--shared)}
.empty h3{color:var(--ink);font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0 0 6px}
.empty p{margin:0 auto;max-width:30ch;font-size:14px}

/* transaction rows */
.txlist{list-style:none;margin:0;padding:0}
.txrow{all:unset;display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;cursor:pointer}
.txlist li + li .txrow, .txlist li + li > .txrow{border-top:1px solid var(--line)}
.txrow:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:10px}
.mlogo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.txrow .mid{flex:1;min-width:0}
.txrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .sm{font-size:12px;color:var(--muted);margin-top:1px}
.txrow .rt{text-align:right;flex:none}
.txrow .amt{font-weight:600}
.st{font-size:12px;margin-top:2px;display:flex;align-items:center;justify-content:flex-end;gap:5px;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.daylab{font-size:12px;font-weight:600;color:var(--faint);padding:14px 0 2px}

/* settings */
.group{background:var(--surface);border-radius:18px;overflow:hidden;margin-bottom:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px}
.item + .item{border-top:1px solid var(--line)}
.item .t{font-size:15px}
.item .t small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.item input[type=text]{border:0;background:none;text-align:right;color:var(--muted);width:50%;padding:0}
.item input[type=text]:focus{color:var(--ink);outline:none}
.stack{display:block}
.stack input[type=range]{width:100%;margin-top:10px;accent-color:var(--you)}
.splitview{display:flex;height:30px;border-radius:10px;overflow:hidden;margin-top:10px;font-size:13px;font-weight:600;color:#fff}
.splitwrap{position:relative;margin-top:10px}
.splitwrap .splitview{height:40px;margin-top:0;border-radius:12px}
.stack input.splitrange[type=range]{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:ew-resize}
.splitrange::-webkit-slider-runnable-track{background:transparent;height:40px}
.splitrange::-moz-range-track{background:transparent;height:40px}
.splitrange::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:28px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.95);border:0;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.splitrange::-moz-range-thumb{width:6px;height:28px;border-radius:3px;background:rgba(255,255,255,.95);border:0;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.splitrange:focus-visible{outline:2px solid var(--you);outline-offset:4px;border-radius:12px}
.splitview span{display:grid;place-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.thresh .th-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.thresh .th-big{font-family:var(--font-display);font-size:52px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.thresh .th-sub{font-size:13px;color:var(--muted);margin-top:4px;max-width:20ch}
.thresh .th-impact{text-align:right;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:8px 12px;flex:none}
.thresh .th-impact b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.thresh .th-impact span{font-size:12px;font-weight:600}
.zones{display:flex;height:28px;border-radius:10px;overflow:hidden;margin-top:12px;font-size:12px;font-weight:600;color:#fff}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;margin-top:10px}
.seg3 button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg3 button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(14,17,22,.12)}

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const STORE_KEY = "shared-budget:v1";
const EXCLUDED = new Set(["TRANSFER_IN","TRANSFER_OUT","INCOME","LOAN_PAYMENTS"]);
const GROUPS = [
  {id:"groceries", label:"Groceries"},
  {id:"dining", label:"Dining"},
  {id:"rent", label:"Rent"},
  {id:"home", label:"Home"},
  {id:"utilities", label:"Utilities & phone"},
  {id:"transport", label:"Transport"},
  {id:"travel", label:"Travel"},
  {id:"entertainment", label:"Entertainment"},
  {id:"health", label:"Health & personal care"},
  {id:"shopping", label:"Shopping"},
  {id:"other", label:"Uncategorized"}
];
function groupOf(t){
  if (S.catOverrides && S.catOverrides[t.id]) return S.catOverrides[t.id];
  if (S.merchantCat && S.merchantCat[t.merchant]) return S.merchantCat[t.merchant];
  if (isXferLike(t)){ const rk = payeeKey(t), rc = rk && (S.recipientChoice || {})[rk]; if (rc && rc.cat) return rc.cat; }
  if (t.det === "FOOD_AND_DRINK_GROCERIES") return "groceries";
  if (t.det === "RENT_AND_UTILITIES_RENT") return "rent";
  switch (t.cat){
    case "FOOD_AND_DRINK": return "dining";
    case "HOME_IMPROVEMENT": return "home";
    case "RENT_AND_UTILITIES": return "utilities";
    case "TRANSPORTATION": return "transport";
    case "TRAVEL": return "travel";
    case "ENTERTAINMENT": return "entertainment";
    case "MEDICAL": case "PERSONAL_CARE": return "health";
    case "GENERAL_MERCHANDISE": return "shopping";
    default: return "other";
  }
}
const groupLabel = id => (GROUPS.find(g => g.id === id) || {label:id}).label;
const BASE_GROUPS = GROUPS.slice();
function syncGroups(){ GROUPS.length = 0; BASE_GROUPS.forEach(g => GROUPS.push(g)); (S.customGroups || []).forEach(g => GROUPS.push(g)); }

/* ---------- placeholder model (used only if model.js is missing) ---------- */
const PLACEHOLDER_MODEL = {
  version: "placeholder",
  intercept: -2.4,
  coef: {
    "det=FOOD_AND_DRINK_GROCERIES": 3.2, "det=FOOD_AND_DRINK_RESTAURANT": -0.6,
    "det=FOOD_AND_DRINK_COFFEE": -2.2, "det=FOOD_AND_DRINK_FAST_FOOD": -1.5,
    "det=RENT_AND_UTILITIES_INTERNET_AND_CABLE": 3.4, "det=RENT_AND_UTILITIES_GAS_AND_ELECTRICITY": 3.6,
    "det=RENT_AND_UTILITIES_TELEPHONE": 3.0, "det=HOME_IMPROVEMENT_FURNITURE": 2.4,
    "det=HOME_IMPROVEMENT_HARDWARE": 1.8, "det=GENERAL_MERCHANDISE_SUPERSTORES": 1.0,
    "det=GENERAL_MERCHANDISE_ONLINE_MARKETPLACES": 0.6, "det=MEDICAL_PHARMACIES_AND_SUPPLEMENTS": 0.2,
    "det=GENERAL_MERCHANDISE_CLOTHING_AND_ACCESSORIES": -2.0, "det=TRANSPORTATION_TAXIS_AND_RIDE_SHARES": -0.8,
    "det=TRANSPORTATION_PUBLIC_TRANSIT": -2.5, "det=TRANSPORTATION_GAS": -0.4,
    "det=ENTERTAINMENT_TV_AND_MOVIES": 1.8, "det=ENTERTAINMENT_MUSIC_AND_AUDIO": 1.2,
    "det=PERSONAL_CARE_HAIR_AND_BEAUTY": -2.2, "det=PERSONAL_CARE_GYMS_AND_FITNESS_CENTERS": -2.5,
    "cat=FOOD_AND_DRINK": 0.2, "cat=HOME_IMPROVEMENT": 0.5, "cat=RENT_AND_UTILITIES": 0.6,
    "cat=TRANSPORTATION": -0.4, "cat=PERSONAL_CARE": -0.6, "cat=ENTERTAINMENT": 0.2,
    "merchant=Trader Joe's": 1.2, "merchant=Whole Foods": 0.8, "merchant=Star Market": 1.0,
    "merchant=Uber Eats": 0.5, "merchant=DoorDash": 0.4, "merchant=Amazon": -0.6,
    "merchant=Target": -0.3, "merchant=Blue Bottle Coffee": -0.5, "merchant=Costco": 0.6,
    "log_amount": 0.9
  },
  scaler: { log_amount: { mean: 3.2, scale: 1.0 } },
  band: { low: 0.2, high: 0.7 },
  learning: { lr: 1.0, lambda: 0.01, categoryFactor: 0.5, maxStep: 1.5 }
};

/* ---------- synthetic data ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SAMPLE_ME = [
  ["Trader Joe's","FOOD_AND_DRINK","FOOD_AND_DRINK_GROCERIES",4,48,18],
  ["Whole Foods","FOOD_AND_DRINK","FOOD_AND_DRINK_GROCERIES",1.5,62,20],
  ["Formaggio Kitchen","FOOD_AND_DRINK","FOOD_AND_DRINK_GROCERIES",0.6,24,14],
  ["Blue Bottle Coffee","FOOD_AND_DRINK","FOOD_AND_DRINK_COFFEE",7,6.5,1.5],
  ["Sweetgreen","FOOD_AND_DRINK","FOOD_AND_DRINK_RESTAURANT",4,17,3],
  ["Uber Eats","FOOD_AND_DRINK","FOOD_AND_DRINK_RESTAURANT",3,48,30],
  ["Amazon","GENERAL_MERCHANDISE","GENERAL_MERCHANDISE_ONLINE_MARKETPLACES",3,52,40],
  ["Target","GENERAL_MERCHANDISE","GENERAL_MERCHANDISE_SUPERSTORES",1.5,40,25],
  ["CVS","MEDICAL","MEDICAL_PHARMACIES_AND_SUPPLEMENTS",1.2,18,8],
  ["Xfinity","RENT_AND_UTILITIES","RENT_AND_UTILITIES_INTERNET_AND_CABLE",-1,80,0],
  ["IKEA","HOME_IMPROVEMENT","HOME_IMPROVEMENT_FURNITURE",0.3,140,60],
  ["Uber","TRANSPORTATION","TRANSPORTATION_TAXIS_AND_RIDE_SHARES",3,19,8],
  ["MBTA","TRANSPORTATION","TRANSPORTATION_PUBLIC_TRANSIT",-1,90,0],
  ["Zara","GENERAL_MERCHANDISE","GENERAL_MERCHANDISE_CLOTHING_AND_ACCESSORIES",0.6,70,25],
  ["Netflix","ENTERTAINMENT","ENTERTAINMENT_TV_AND_MOVIES",-1,15.49,0],
  ["Sephora","PERSONAL_CARE","PERSONAL_CARE_HAIR_AND_BEAUTY",0.5,45,15]
];
const SAMPLE_PARTNER = [
  ["Star Market","FOOD_AND_DRINK","FOOD_AND_DRINK_GROCERIES",3,55,20],
  ["Brothers Market","FOOD_AND_DRINK","FOOD_AND_DRINK_GROCERIES",1,22,10],
  ["Costco","GENERAL_MERCHANDISE","GENERAL_MERCHANDISE_SUPERSTORES",0.7,160,50],
  ["Eversource","RENT_AND_UTILITIES","RENT_AND_UTILITIES_GAS_AND_ELECTRICITY",-1,95,20],
  ["Spotify","ENTERTAINMENT","ENTERTAINMENT_MUSIC_AND_AUDIO",-1,16.99,0],
  ["Home Depot","HOME_IMPROVEMENT","HOME_IMPROVEMENT_HARDWARE",0.5,60,30],
  ["Wayfair","HOME_IMPROVEMENT","HOME_IMPROVEMENT_FURNITURE",0.3,120,40],
  ["Dunkin'","FOOD_AND_DRINK","FOOD_AND_DRINK_COFFEE",6,5,1.5],
  ["Chipotle","FOOD_AND_DRINK","FOOD_AND_DRINK_FAST_FOOD",3,14,3],
  ["DoorDash","FOOD_AND_DRINK","FOOD_AND_DRINK_RESTAURANT",2,45,22],
  ["Shell","TRANSPORTATION","TRANSPORTATION_GAS",2,48,10],
  ["Amazon","GENERAL_MERCHANDISE","GENERAL_MERCHANDISE_ONLINE_MARKETPLACES",2,38,30],
  ["Walgreens","MEDICAL","MEDICAL_PHARMACIES_AND_SUPPLEMENTS",1,22,10],
  ["Planet Fitness","PERSONAL_CARE","PERSONAL_CARE_GYMS_AND_FITNESS_CENTERS",-1,25,0]
];
function makeSample(owner, templates, seed){
  const rnd = mulberry32(seed);
  const out = [];
  const months = [[2026,6,30],[2026,7,31],[2026,8,31],[2026,9,30],[2026,10,31],[2026,11,13]];
  let n = 0;
  months.forEach(([y,m,lastDay]) => {
    templates.forEach(([merchant,cat,det,freq,mean,sd]) => {
      let count;
      if (freq < 0) count = (m === 11 && lastDay < 15) ? (rnd() < 0.5 ? 1 : 0) : 1;
      else { count = Math.floor(freq * lastDay / 30); if (rnd() < (freq * lastDay / 30) % 1) count++; }
      for (let i = 0; i < count; i++){
        const day = 1 + Math.floor(rnd() * lastDay);
        let amt = mean + sd * ((rnd() + rnd() + rnd()) - 1.5) * 1.6;
        amt = Math.max(2.5, Math.round(amt * 100) / 100);
        out.push({
          id: owner + "-s" + (n++),
          owner, merchant, cat, det, amount: amt,
          date: y + "-" + String(m).padStart(2,"0") + "-" + String(day).padStart(2,"0")
        });
      }
    });
  });
  return out.sort((a,b) => a.date < b.date ? 1 : -1);
}

/* ---------- state ---------- */
const deepCopy = o => JSON.parse(JSON.stringify(o));
/* The trained model from model.js; the placeholder only if that file didn't load. */
const BUILTIN_MODEL = (window.SHARED_MODEL && typeof window.SHARED_MODEL.intercept === "number" && window.SHARED_MODEL.coef) ? window.SHARED_MODEL : PLACEHOLDER_MODEL;
/* Broad category from the detailed one, the same rule the model was trained with:
   the first primary category the detailed category starts with, else OTHER. */
const PRIMARY_CATS = BUILTIN_MODEL.primaryCategories || ["FOOD_AND_DRINK","GENERAL_MERCHANDISE","GENERAL_SERVICES","HOME_IMPROVEMENT","RENT_AND_UTILITIES","TRANSPORTATION","TRAVEL","ENTERTAINMENT","MEDICAL","PERSONAL_CARE","GOVERNMENT_AND_NON_PROFIT","LOAN_PAYMENTS","BANK_FEES","TRANSFER_IN","TRANSFER_OUT","INCOME"];
const primaryOf = det => PRIMARY_CATS.find(p => det.startsWith(p)) || "OTHER";
const defaultState = (seed) => ({
  names: { me: "Jordan", partner: "Alex" },
  splitMe: 70,
  viewer: "me",
  tab: "home",
  month: null,
  historyGroup: "all",
  source: { me: "sample", partner: "sample" },
  tx: {
    me: makeSample("me", SAMPLE_ME, seed ? seed : 7).concat([{ id: "me-v1", owner: "me", merchant: "Venmo", cat: "TRANSFER_OUT", det: "TRANSFER_OUT_ACCOUNT_TRANSFER", amount: 150, date: "2026-11-03" },
      { id: "me-z1", owner: "me", merchant: "Zelle Back Bay Rentals", cat: "TRANSFER_OUT", det: "TRANSFER_OUT_ACCOUNT_TRANSFER", amount: 1400, date: "2026-11-01" },
      { id: "me-v2", owner: "me", merchant: "Venmo", cat: "TRANSFER_OUT", det: "TRANSFER_OUT_ACCOUNT_TRANSFER", amount: 42, date: "2026-11-08" }]),
    partner: makeSample("partner", SAMPLE_PARTNER, seed ? seed + 14 : 21).concat([{ id: "partner-v1", owner: "partner", merchant: "Venmo", cat: "TRANSFER_IN", det: "TRANSFER_IN_ACCOUNT_TRANSFER", amount: -150, date: "2026-11-04" }])
  },
  userLabels: {},
  baseModel: deepCopy(BUILTIN_MODEL),
  model: deepCopy(BUILTIN_MODEL)
});
let S = load() || defaultState();
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){ /* storage full or unavailable */ }
}

/* ---------- model ---------- */
const sigmoid = z => 1 / (1 + Math.exp(-z));
function zAmount(m, t){
  const sc = (m.scaler && m.scaler.log_amount) || {mean:0, scale:1};
  return (Math.log1p(Math.max(t.amount, 0)) - sc.mean) / (sc.scale || 1);
}
function score(t, m){
  m = m || S.model;
  const c = m.coef;
  const wm = c["merchant=" + t.merchant];
  const we = c["emb=" + t.merchant];          // precomputed embedding effect, known merchants only
  const wd = c["det=" + (t.det || "UNKNOWN")] || 0;
  const wc = c["cat=" + t.cat] || 0;
  const wch = c["channel=" + (t.channel || "unknown")] || 0;
  const za = zAmount(m, t);
  const wa = (c["log_amount"] || 0) * za;
  const merch = (wm === undefined && we === undefined) ? undefined : (wm || 0) + (we || 0);
  const z = m.intercept + (merch || 0) + wd + wc + wch + wa;
  return { p: sigmoid(z), merchant: merch, category: wd + wc, amount: wa, za };
}
function status(t){
  const u = S.userLabels[t.id];
  const sc = score(t);
  if (u === true || u === false) return { kind: u ? "shared" : "solo", source: "you", p: sc.p };
  const band = S.model.band || {low:0.2, high:0.7};
  if (sc.p >= band.high) return { kind: "shared", source: "auto", p: sc.p };
  if (sc.p <= band.low) return { kind: "solo", source: "auto", p: sc.p };
  return { kind: "review", source: "model", p: sc.p };
}
function prettyDet(t){
  let s = t.det || t.cat || "Other";
  if (t.cat && s.startsWith(t.cat + "_")) s = s.slice(t.cat.length + 1);
  s = s.toLowerCase().replace(/_/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function reasons(t){
  const sc = score(t);
  const out = [];
  const cat = prettyDet(t).toLowerCase();
  if (sc.merchant === undefined) out.push({w: 0.01, text: "First time at " + t.merchant + ", so it’s judged by its category"});
  else if (Math.abs(sc.merchant) > 0.15) out.push({w: Math.abs(sc.merchant), text: sc.merchant > 0 ? "You often share purchases at " + t.merchant : "Purchases at " + t.merchant + " are usually just yours"});
  if (Math.abs(sc.category) > 0.15) out.push({w: Math.abs(sc.category), text: sc.category > 0 ? "Usually shared: " + cat : "Usually just yours: " + cat});
  if (Math.abs(sc.amount) > 0.3) out.push({w: Math.abs(sc.amount), text: sc.amount > 0 ? "Larger than a typical solo purchase" : "Small amount"});
  return out.sort((a,b) => b.w - a.w).slice(0, 2).map(r => r.text);
}
/* One gradient step on the merchant and category weights only.
   Intercept and amount weights stay fixed until the next full retrain in Python. */
function learn(t, y){
  const m = S.model;
  const L = m.learning || PLACEHOLDER_MODEL.learning;
  const before = score(t).p;
  const err = before - y;
  const step = (key, factor) => {
    const w = m.coef[key] || 0;
    let d = L.lr * factor * (err + L.lambda * w);
    d = Math.max(-L.maxStep, Math.min(L.maxStep, d));
    m.coef[key] = Math.round((w - d) * 1e6) / 1e6;
  };
  step("merchant=" + t.merchant, 1);
  if (t.det) step("det=" + t.det, L.categoryFactor);
  if (t.cat) step("cat=" + t.cat, L.categoryFactor);
  return { before, after: score(t).p };
}

/* ---------- derived numbers ---------- */
const other = v => v === "me" ? "partner" : "me";
const nameOf = v => S.names[v];
const pctOf = v => v === "me" ? S.splitMe : 100 - S.splitMe;
const spend = list => list.filter(t => !EXCLUDED.has(t.cat) || transferIsPurchase(t));
/* Venmo, Zelle and other transfers: the person decides whether each is a purchase, a payment to their partner, or ignorable. */
const GENERIC_PAYEES = ["venmo", "zelle", "paypal", "cash app", "cashapp", "transfer", "online transfer"];
function payeeKey(t){ const k = String(t.merchant).trim().toLowerCase(); return (GENERIC_PAYEES.includes(k) || k.length < 3) ? null : k; }
function transferDecision(t){
  if (!isXferLike(t)) return null;
  const c = (S.transferChoice || {})[t.id]; if (c) return c;
  const k = payeeKey(t), r = k && (S.recipientChoice || {})[k];
  return r ? r.kind : null;
}
/* Outgoing transfers count as spending (Uncategorized until sorted) unless ignored or counted as a payment to the partner. */
let CAND_IDS = null;
function candIds(){ if (!CAND_IDS){ CAND_IDS = new Set(); settlementCandidates().forEach(c => c.txIds.forEach(id => CAND_IDS.add(id))); } return CAND_IDS; }
/* Outgoing transfers count as spending; incoming ones (someone paying you back) count as negative spending. Either can be ignored. */
function transferIsPurchase(t){ return isXferLike(t) && t.amount !== 0 && transferDecision(t) !== "ignore" && !inSettlement(t.id); }
const inSettlement = id => (S.settlements || []).some(s => (s.txIds || []).includes(id));
function pendingTransfers(v, ym){
  const candIds = new Set(); settlementCandidates().forEach(c => c.txIds.forEach(id => candIds.add(id)));
  return S.tx[v].filter(t => TRANSFER_CATS.has(t.cat) && t.amount > 0 && !transferDecision(t) && !inSettlement(t.id) && !candIds.has(t.id) && (!ym || t.date.slice(0,7) === ym))
    .sort((a,b) => a.date < b.date ? 1 : -1);
}
const inMonth = (list, ym) => list.filter(t => t.date.slice(0,7) === ym);
function allMonths(){
  const set = new Set();
  ["me","partner"].forEach(v => spend(S.tx[v]).forEach(t => set.add(t.date.slice(0,7))));
  return [...set].sort();
}
function ownerPct(t){ const o = S.splitOverrides ? S.splitOverrides[t.id] : undefined; return (typeof o === "number") ? o : pctOf(t.owner); }
function shareOf(t, v){ return t.amount * (t.owner === v ? ownerPct(t) : 100 - ownerPct(t)) / 100; }
const TRANSFER_CATS = new Set(["TRANSFER_IN","TRANSFER_OUT"]);
/* Payment-app transfers, even when Plaid files them under another excluded category (income, loan payments) or none. */
const isXferLike = t => TRANSFER_CATS.has(t.cat) || ((!t.cat || EXCLUDED.has(t.cat)) && /\b(zelle|venmo|paypal|cash ?app)\b/i.test(String(t.merchant)));
const dayDiff = (a, b) => (new Date(a) - new Date(b)) / 86400000;
const firstName = v => String(nameOf(v)).trim().split(/\s+/)[0].toLowerCase();
/* Transfers between the two people, found in both connected accounts (Venmo, Zelle, bank transfers). */
function settlementCandidates(){
  const done = new Set(); (S.settlements || []).forEach(s => (s.txIds || []).forEach(id => done.add(id)));
  const dis = S.dismissed || {};
  const out = [];
  ["me","partner"].forEach(payer => {
    const payee = other(payer);
    const usable = t => isXferLike(t) && !done.has(t.id) && !dis[t.id] && !transferDecision(t);
    const outs = S.tx[payer].filter(t => usable(t) && t.amount > 0);
    const ins = S.tx[payee].filter(t => usable(t) && t.amount < 0);
    outs.forEach(t => {
      const mi = ins.findIndex(u => Math.abs(Math.abs(u.amount) - t.amount) < 0.01 && Math.abs(dayDiff(u.date, t.date)) <= 3);
      const named = firstName(payee).length > 1 && t.merchant.toLowerCase().includes(firstName(payee));
      if (mi >= 0 || named){
        const m = mi >= 0 ? ins.splice(mi, 1)[0] : null;
        out.push({ from: payer, to: payee, amount: t.amount, date: t.date, txIds: m ? [t.id, m.id] : [t.id], via: t.merchant });
      }
    });
    ins.forEach(u => {
      if (firstName(payer).length > 1 && u.merchant.toLowerCase().includes(firstName(payer)))
        out.push({ from: payer, to: payee, amount: Math.abs(u.amount), date: u.date, txIds: [u.id], via: u.merchant });
    });
  });
  return out.sort((a,b) => a.date < b.date ? 1 : -1);
}
const candidatesFor = v => settlementCandidates().filter(c => c.from === v || c.to === v);
const monthSettlements = (v, ym) => (S.settlements || []).filter(s => s.date.slice(0,7) === ym && (s.from === v || s.to === v));
/* Positive: the other person owes v. Shared costs across every month, adjusted for payments between them. */
function balanceFor(v){
  let b = 0;
  allMonths().forEach(ym => { b += monthSummary(v, ym).net; });
  (S.settlements || []).forEach(s => { if (s.from === v) b += s.amount; else if (s.to === v) b -= s.amount; });
  return b;
}
function monthSummary(v, ym){
  const o = other(v);
  const mine = spend(inMonth(S.tx[v], ym));
  const theirs = spend(inMonth(S.tx[o], ym));
  let card = 0, solo = 0, sharedMine = 0, sharedTheirs = 0, reviewAmt = 0, reviewN = 0, myShare = 0;
  const byGroup = {}; GROUPS.forEach(g => byGroup[g.id] = {ind:0, sh:0});
  mine.forEach(t => {
    const st = status(t); card += t.amount;
    const g = groupOf(t);
    if (st.kind === "shared"){ const s = shareOf(t, v); sharedMine += t.amount; myShare += s; byGroup[g].sh += s; }
    else { solo += t.amount; byGroup[g].ind += t.amount; if (st.kind === "review"){ reviewAmt += t.amount; reviewN++; } }
  });
  theirs.forEach(t => {
    if (status(t).kind === "shared"){ const s = shareOf(t, v); sharedTheirs += t.amount; myShare += s; byGroup[groupOf(t)].sh += s; }
  });
  const sharedTotal = sharedMine + sharedTheirs;
  return { card, solo, sharedMine, sharedTheirs, sharedTotal, myShare,
    real: solo + myShare, net: sharedMine - myShare, byGroup, reviewAmt, reviewN };
}
function reviewQueue(v){
  return spend(S.tx[v]).map(t => ({t, st: status(t)}))
    .filter(x => x.st.kind === "review")
    .sort((a,b) => (b.t.amount * (1 - Math.abs(2*b.st.p - 1))) - (a.t.amount * (1 - Math.abs(2*a.st.p - 1))));
}

const money2 = n => fmt2.format(n);

  const [y,m] = ym.split("-").map(Number);

  return new Date(y, m-1, dd).toLocaleDateString("en-US", {month:"short", day:"numeric"});
}

function historyChart(v){
  const ms = allMonths();
  const end = ms.indexOf(S.month);
  const sel = ms.slice(Math.max(0, end - 5), end + 1);
  const data = sel.map(ym => {
    const x = monthSummary(v, ym);
    if (S.historyGroup === "all") return {ym, ind: x.solo, sh: x.myShare};
    const g = x.byGroup[S.historyGroup]; return {ym, ind: g.ind, sh: g.sh};
  });
  const max = Math.max(1, ...data.map(d => Math.max(0, d.ind) + Math.max(0, d.sh)));
  const W = 400, H = 190, top = 22, bottom = 24, n = data.length;
  const slot = W / Math.max(n, 1), bw = Math.min(36, slot * 0.5);
  const h = val => Math.max(0, val) / max * (H - top - bottom);
  let out = "";
  [0.5, 1].forEach(f => { const y = H - bottom - f * (H - top - bottom); out += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/>`; });
  data.forEach((d, i) => {

let toastTimer;
function toast(msg){

function decide(y){
  const q = reviewQueue(S.viewer);

  if (reviewIdx >= q.length - 1) reviewIdx = 0;

function applyLabel(t, y){

  const wasShared = status(t).kind === "shared";
  learn(t, y);
  S.userLabels[t.id] = !!y;
  save();
  const o = other(t.owner), share = money2(shareOf(t, o)), mon = monthName(t.date.slice(0,7), true);
  if (y && !wasShared) toast(`Shared with ${nameOf(o)}. Their ${share} share is now in their ${mon} spending.`);
  else if (!y && wasShared) toast(`Marked just yours. ${share} came off ${nameOf(o)}’s ${mon} spending.`);
  else toast(`Marked ${y ? "shared" : "just yours"}.`);
}
function wireSwipe(){
  const card = document.getElementById("topcard");
  if (!card) return;
  let startX = 0, dx = 0, dragging = false;
  const stS = card.querySelector(".stamp.sh"), stO = card.querySelector(".stamp.so");
  const setPos = (x, anim) => {
    card.style.transition = anim ? "transform .25s ease" : "none";
    card.style.transform = `translateX(${x}px) rotate(${x/20}deg)`;
    stS.style.opacity = Math.max(0, Math.min(1, x/80));
    stO.style.opacity = Math.max(0, Math.min(1, -x/80));
  };
  const fling = y => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ decide(y); return; }
    setPos(y ? 520 : -520, true);
    setTimeout(() => decide(y), 220);
  };
  card.addEventListener("pointerdown", e => { if (e.target.closest(".catchip")) return; dragging = true; startX = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); });
  card.addEventListener("pointermove", e => { if (dragging){ dx = e.clientX - startX; setPos(dx, false); } });
  const end = () => { if (!dragging) return; dragging = false; if (dx > 90) fling(1); else if (dx < -90) fling(0); else setPos(0, true); };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("keydown", e => {
    if (e.key === "ArrowRight"){ e.preventDefault(); fling(1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); fling(0); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){ const n = reviewQueue(S.viewer).length; if (n > 1){ e.preventDefault(); reviewIdx = clampIdx(n) + (e.key === "ArrowDown" ? 1 : -1); clampIdx(n); render(); const c = document.getElementById("topcard"); if (c) c.focus({preventScroll:true}); } }
  });
}

function previewText(low){

function questionsPerMonth(low){
  const list = spend(S.tx[S.viewer]);

const fmtQ = q => q < 10 ? String(Math.round(q * 10) / 10) : String(Math.round(q));
function zonesHTML(low, high){

function itemSettlement(tid){ return (S.settlements || []).find(s => s.how === "item" && s.txIds && s.txIds[0] === tid); }
/* A payment between the two people settles everything up to that day. The gap between what was owed and what was paid is shown, and can be carried forward. */
function lastSettleDate(){ return (S.settlements || []).filter(s => s.how !== "item").reduce((m, s) => s.date > m ? s.date : m, ""); }
function contribWindow(v, from, to){
  const o = other(v), inW = d => d > from && d <= to; let b = 0;
  spend(S.tx[v]).forEach(t => { if (inW(t.date) && status(t).kind === "shared") b += shareOf(t, o); });
  spend(S.tx[o]).forEach(t => { if (inW(t.date) && status(t).kind === "shared") b -= shareOf(t, v); });
  (S.settlements || []).forEach(s => { if (s.how === "item" && inW(s.date)) b += s.from === v ? s.amount : -s.amount; });
  return b;
}
function settleHistory(v){
  const groups = [];
  (S.settlements || []).filter(s => s.how !== "item").sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(p => {
    const g = groups[groups.length - 1];
    if (g && g.date === p.date) g.pays.push(p); else groups.push({ date: p.date, pays: [p] });
  });
  let prev = "";
  return groups.map(g => {
    const owed = contribWindow(v, prev, g.date);
    const paid = g.pays.reduce((a, p) => a + (p.from === v ? p.amount : -p.amount), 0);
    const h = { date: g.date, from: prev, pays: g.pays, owed, paid, delta: owed + paid, carried: !!(S.carry || {})[g.date] };
    prev = g.date;
    return h;
  });
}

/* ---------- file import ---------- */
function findCol(headers, tests){
  for (const test of tests){
    const h = headers.find(h => test(h.toLowerCase().trim()));
    if (h !== undefined) return h;
  }
  return null;
}
function toISO(v){
  if (v instanceof Date && !isNaN(v)) return v.getFullYear() + "-" + String(v.getMonth()+1).padStart(2,"0") + "-" + String(v.getDate()).padStart(2,"0");
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + "-" + m[2].padStart(2,"0") + "-" + m[3].padStart(2,"0");
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return y + "-" + m[1].padStart(2,"0") + "-" + m[2].padStart(2,"0"); }
  return null;
}
function importRows(owner, rows, fileName){
  if (!rows.length) throw new Error("The file has no rows.");
  const headers = Object.keys(rows[0]);
  const cDate = findCol(headers, [h => h === "date", h => h.includes("date")]);
  const cMerch = findCol(headers, [h => h.includes("merchant"), h => h === "name", h => h.includes("description")]);
  const cAmt = findCol(headers, [h => h.startsWith("amount"), h => h.includes("amount")]);
  const cDet = findCol(headers, [h => h.includes("detailed")]);
  const cCat = findCol(headers, [h => h === "category", h => h.includes("category") && !h.includes("detailed")]);
  const cId = findCol(headers, [h => h.includes("transaction id"), h => h === "id"]);
  const cChan = findCol(headers, [h => h.includes("channel")]);
  const cLabel = findCol(headers, [h => h.includes("solo"), h => h.includes("shared"), h => h === "label"]);
  const missing = [["Date",cDate],["Merchant",cMerch],["Amount",cAmt]].filter(x => !x[1]).map(x => x[0]);
  if (missing.length) throw new Error("Couldn’t find these columns: " + missing.join(", ") + ".");
  const out = []; const labels = {};
  rows.forEach((r, i) => {
    const date = toISO(r[cDate]);
    const amount = typeof r[cAmt] === "number" ? r[cAmt] : parseFloat(String(r[cAmt]).replace(/[$,\s]/g, ""));
    if (!date || isNaN(amount) || !String(r[cMerch]).trim()) return;
    const id = owner + "-u-" + (cId && r[cId] ? String(r[cId]) : fileName.replace(/[^A-Za-z0-9]/g, "") + "-" + i);
    const det = cDet ? String(r[cDet]).trim() : "";
    let cat = cCat ? String(r[cCat]).trim() : "";
    if (!cat && det) cat = primaryOf(det);
    out.push({ id, owner, date, amount, merchant: String(r[cMerch]).trim(), cat, det, src: fileName, channel: cChan ? String(r[cChan]).trim() : "" });
    if (cLabel){
      const l = String(r[cLabel]).trim().toLowerCase();
      if (l === "group" || l === "shared") labels[id] = true;
      else if (l === "solo") labels[id] = false;
    }
  });
  if (!out.length) throw new Error("No rows had a readable date, merchant, and amount.");
  const wasSample = !S.source[owner] || S.source[owner] === "sample" || S.source[owner] === "No file yet";
  const kept = wasSample ? [] : S.tx[owner].filter(t => t.src !== fileName);
  const keptIds = new Set(kept.map(t => t.id));
  Object.keys(S.userLabels).forEach(k => { if (k.startsWith(owner + "-") && !keptIds.has(k)) delete S.userLabels[k]; });
  Object.assign(S.userLabels, labels);
  const byId = new Map(); kept.concat(out).forEach(t => byId.set(t.id, t));
  S.tx[owner] = [...byId.values()];
  const files = wasSample ? [] : String(S.source[owner]).split(", ").filter(f => f && f !== fileName);
  S.source[owner] = files.concat(fileName).join(", ");
  S.month = null;
  save();
  const nl = Object.keys(labels).length;
  toast(`Loaded ${out.length} transactions for ${S.names[owner]}${nl ? `, including ${nl} past decisions` : ""}.`);
}
function readFile(owner, file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      if (typeof XLSX === "undefined") throw new Error("The file reader didn’t load. Check your connection and reload the page.");
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {raw:true, defval:""});
      importRows(owner, rows, file.name);
      render();
    } catch(err){ toast(err.message || "Couldn’t read that file."); }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- event delegation ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close"){ if (e.target === el) closeSheet(); return; }
  if (act === "tab"){ S.tab = el.dataset.t; save(); render(); window.scrollTo(0,0); }
  else if (act === "viewer"){ S.viewer = el.dataset.v; save(); render(); }
  else if (act === "month"){ const ms = allMonths(); const i = ms.indexOf(S.month) + Number(el.dataset.d); if (ms[i]){ S.month = ms[i]; save(); render(); } }
  else if (act === "opencat"){ S.txGroup = el.dataset.g; S.tab = "activity"; save(); render(); window.scrollTo(0,0); }
  else if (act === "hgroup"){ S.historyGroup = el.dataset.g; save(); render(); }
  else if (act === "txgroup"){ S.txGroup = el.dataset.g; save(); render(); }
  else if (act === "revnav"){ const n = reviewQueue(S.viewer).length; if (n > 1){ reviewIdx = clampIdx(n) + Number(el.dataset.d); clampIdx(n); render(); const c = document.getElementById("topcard"); if (c) c.focus({preventScroll:true}); } }
  else if (act === "decide"){
    const card = document.getElementById("topcard");
    const y = Number(el.dataset.y);
    if (card && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      card.style.transition = "transform .25s ease"; card.style.transform = `translateX(${y ? 520 : -520}px) rotate(${y ? 20 : -20}deg)`;
      setTimeout(() => decide(y), 220);
    } else decide(y);
  }
  else if (act === "open") openSheet(el.dataset.id);
  else if (act === "mark"){
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id);
    if (t){ applyLabel(t, Number(el.dataset.y)); closeSheet(); render(); }
  }
  else if (act === "tpurchase"){
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id); if (!t) return;
    const k = payeeKey(t);
    overlay.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="What did you buy?">
      <div class="grab"></div>
      <div class="hd">${logo(t.merchant, "mlogo")}<div><div class="nm">What was it for?</div><div class="sm">${esc(t.merchant)}, ${money2(t.amount)}, ${dayName(t.date)}</div></div></div>
      <ul class="catlist">${GROUPS.filter(g => g.id !== "other").map(g => `<li><button data-act="tcat" data-id="${esc(t.id)}" data-g="${g.id}">${catIcon(g.id)}<span>${esc(g.label)}</span></button></li>`).join("")}</ul>
      ${k ? `<label class="allrow"><input type="checkbox" id="tremember" checked>Treat every payment to ${esc(t.merchant)} this way</label>` : `<p class="foot" style="margin:8px 0 0">This bank description doesn’t name who was paid, so the choice applies to this payment only.</p>`}
    </div></div>`;
    const f = overlay.querySelector(".catlist button"); if (f) f.focus();
  }
  else if (act === "tcat"){
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id); if (!t) return;
    S.transferChoice = S.transferChoice || {}; S.catOverrides = S.catOverrides || {}; S.recipientChoice = S.recipientChoice || {};
    S.transferChoice[t.id] = "purchase"; S.catOverrides[t.id] = el.dataset.g;
    const rem = document.getElementById("tremember"), k = payeeKey(t);
    if (rem && rem.checked && k) S.recipientChoice[k] = { kind: "purchase", cat: el.dataset.g };
    save(); closeSheet(); render();
    toast(`Counted as ${groupLabel(el.dataset.g)}. It now appears with your other purchases, where you can mark it shared.`);
  }
  else if (act === "tpartner"){
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id); if (!t) return;
    S.settlements = S.settlements || [];
    S.settlements.push({ id: "s" + Date.now().toString(36), from: t.amount < 0 ? other(t.owner) : t.owner, to: t.amount < 0 ? t.owner : other(t.owner), amount: Math.abs(t.amount), date: t.date, txIds: [t.id], via: t.merchant, how: "transfer" });
    save(); closeSheet(); render(); toast(`Counted ${money2(t.amount)} to ${nameOf(other(t.owner))} toward settling up.`);
  }
  else if (act === "tignore"){
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id); if (!t) return;
    S.transferChoice = S.transferChoice || {}; S.transferChoice[t.id] = "ignore";
    save(); closeSheet(); render(); toast(`${money2(t.amount)} to ${t.merchant} no longer counts as spending.`);
  }
  else if (act === "sethistory"){ openHistorySheet(); }
  else if (act === "carry"){ S.carry = S.carry || {}; if (S.carry[el.dataset.d]) delete S.carry[el.dataset.d]; else S.carry[el.dataset.d] = true; save(); render(); openHistorySheet(); }
  else if (act === "paidlist"){ paidShowSettled = false; openPaidSheet(el.dataset.payer); }
  else if (act === "togglesettled"){ paidShowSettled = !paidShowSettled; openPaidSheet(el.dataset.payer); }
  else if (act === "settleitem" || act === "settleall"){
    const payer = el.dataset.payer, debtor = other(payer);
    S.settlements = S.settlements || [];
    const add = t => S.settlements.push({ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), from: debtor, to: payer, amount: Math.round(shareOf(t, debtor) * 100) / 100, date: t.date, txIds: [t.id], via: `Paid back for ${t.merchant}`, how: "item" });
    if (act === "settleitem"){
      const t = S.tx[payer].find(x => x.id === el.dataset.id);
      const s = t && itemSettlement(t.id);
      if (s) S.settlements = S.settlements.filter(x => x !== s); else if (t) add(t);
    } else paidItems(payer).filter(t => !itemSettlement(t.id)).forEach(add);
    save(); render(); openPaidSheet(payer);
  }
  else if (act === "settleyes"){
    const c = candidatesFor(S.viewer)[Number(el.dataset.k) || 0];
    if (c){ S.settlements = S.settlements || []; S.settlements.push({ id: "s" + Date.now().toString(36), ...c, how: "matched" }); save(); render(); toast(`Counted ${money2(c.amount)} from ${nameOf(c.from)} to ${nameOf(c.to)} toward settling up.`); }
  }
  else if (act === "settleno"){
    const c = candidatesFor(S.viewer)[Number(el.dataset.k) || 0];
    if (c){ S.dismissed = S.dismissed || {}; c.txIds.forEach(id => S.dismissed[id] = true); save(); render(); }
  }
  else if (act === "delsettle"){
    S.settlements = (S.settlements || []).filter(s => s.id !== el.dataset.id); save(); render(); if (el.dataset.reopen){ if (settleHistory(S.viewer).length) openHistorySheet(); else closeSheet(); } toast("Payment removed.");
  }
  else if (act === "recordpay"){
    const v = S.viewer, o = other(v), today = new Date().toISOString().slice(0,10);
    overlay.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Record a payment">
      <div class="grab"></div>
      <div class="hd"><span class="cic" style="background:var(--shared-soft);color:var(--shared)">${svg(ICON.swap)}</span><div><div class="nm">Record a payment</div><div class="sm">Cash, Zelle, or anything the app didn’t catch</div></div></div>
      <div class="seg3" style="grid-template-columns:1fr 1fr;margin-top:16px" role="radiogroup" aria-label="Who paid">
        <button role="radio" data-act="paydir" data-from="${v}" aria-checked="true">You paid ${esc(nameOf(o))}</button>
        <button role="radio" data-act="paydir" data-from="${o}" aria-checked="false">${esc(nameOf(o))} paid you</button>
      </div>
      <div class="payrow"><label>Amount<input id="payamt" type="text" inputmode="decimal" placeholder="0.00"></label><label>Date<input id="paydate" type="date" value="${today}"></label></div>
      <div class="acts" style="grid-template-columns:1fr"><button class="b-shared" data-act="savepay">Save payment</button></div>
    </div></div>`;
    const a = document.getElementById("payamt"); if (a) a.focus();
  }
  else if (act === "paydir"){
    el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-checked", b === el ? "true" : "false"));
  }
  else if (act === "savepay"){

    const date = (document.getElementById("paydate") || {}).value;
    const sel = overlay.querySelector('[data-act="paydir"][aria-checked="true"]');
    if (!(amt > 0)){ toast("Enter an amount above zero."); return; }
    if (!date){ toast("Pick a date."); return; }
    const from = sel ? sel.dataset.from : S.viewer;
    S.settlements = S.settlements || [];
    S.settlements.push({ id: "s" + Date.now().toString(36), from, to: other(from), amount: Math.round(amt * 100) / 100, date, txIds: [], via: "Recorded payment", how: "manual" });
    save(); closeSheet(); render(); toast(`Recorded ${money2(amt)} from ${nameOf(from)} to ${nameOf(other(from))}.`);
  }
  else if (act === "decidecustom"){
    const q = reviewQueue(S.viewer);
    if (q.length){ const t = q[clampIdx(q.length)].t; applyLabel(t, 1); if (reviewIdx >= q.length - 1) reviewIdx = 0; render(); openSheet(t.id); }
  }
  else if (act === "txsplitreset"){
    if (S.splitOverrides) delete S.splitOverrides[el.dataset.id];
    save(); render(); openSheet(el.dataset.id);
  }
  else if (act === "unmark"){ delete S.userLabels[el.dataset.id]; save(); closeSheet(); render(); }
  else if (act === "bandpreset"){ const v = Number(el.dataset.v); [S.model, S.baseModel].forEach(m => { m.band.low = v; }); save(); render(); }
  else if (act === "recat"){ e.stopPropagation(); openCatPicker(el.dataset.id); }
  else if (act === "addcat"){
    const input = document.getElementById("newcatname");
    const name = input ? input.value.trim() : "";
    if (!name){ toast("Type a name for the new category first."); if (input) input.focus(); return; }
    S.customGroups = S.customGroups || [];
    let g = GROUPS.find(x => x.label.toLowerCase() === name.toLowerCase());
    if (!g){ g = { id: "c_" + Date.now().toString(36), label: name }; S.customGroups.push(g); syncGroups(); }
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id);
    if (t){
      const allBox = document.getElementById("catall");
      S.catOverrides = S.catOverrides || {}; S.merchantCat = S.merchantCat || {};
      if (allBox && allBox.checked){
        S.merchantCat[t.merchant] = g.id;
        S.tx[S.viewer].forEach(x => { if (x.merchant === t.merchant) delete S.catOverrides[x.id]; });
      } else S.catOverrides[t.id] = g.id;
    }
    save(); closeSheet(); render();
    toast(`Added ${g.label} and moved ${t ? t.merchant : "the purchase"} there.`);
  }
  else if (act === "setcat"){
    if (el.dataset.g === "other" && !el.dataset.force){ openCatPicker(el.dataset.id, "other"); return; }
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id);
    if (t){
      const allBox = document.getElementById("catall");
      S.catOverrides = S.catOverrides || {}; S.merchantCat = S.merchantCat || {};
      if (allBox && allBox.checked){
        S.merchantCat[t.merchant] = el.dataset.g;
        S.tx[S.viewer].forEach(x => { if (x.merchant === t.merchant) delete S.catOverrides[x.id]; });
      } else S.catOverrides[t.id] = el.dataset.g;
      save(); closeSheet(); render();
      toast(`Moved ${allBox && allBox.checked ? "all " + t.merchant + " purchases" : t.merchant} to ${groupLabel(el.dataset.g)}.`);
    }
  }
  else if (act === "resetLearning"){ S.model = deepCopy(S.baseModel); save(); render(); toast("Swipe learning undone. Your decisions are kept."); }
  else if (act === "sample"){
    if (!confirm("Restart with the sample data? This clears uploaded transactions, decisions, splits, categories, payments, and learned weights on this device.")) return;
    S = defaultState(); reviewIdx = 0; paidShowSettled = false; save(); render(); window.scrollTo(0,0); toast("Restarted with the sample data.");
  }
  else if (act === "clearAll"){
    if (!confirm("Clear all transactions, decisions, and learned weights on this device?")) return;
    try { localStorage.removeItem(STORE_KEY); } catch(err){}
    S = defaultState(); S.tx = {me:[], partner:[]}; S.source = {me:"No file yet", partner:"No file yet"}; S.tab = "settings"; save(); render();
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.act === "txsplit"){
    const t = S.tx[S.viewer].find(x => x.id === el.dataset.id);
    if (t){
      S.splitOverrides = S.splitOverrides || {};
      S.splitOverrides[t.id] = Number(el.value); save();
      const sv = document.getElementById("txsplitview"); if (sv) sv.innerHTML = splitSpans(t, Number(el.value));
      const end = el.closest(".txsplit").querySelector(".ends span"); if (end) end.textContent = `${nameOf(other(t.owner))}’s share: ${money2(t.amount * (100 - Number(el.value)) / 100)}`;
    }
  }
  if (el.dataset.act === "split"){
    S.splitMe = Number(el.value); save();
    const sv = document.getElementById("splitview");
    if (sv){ const [a,b] = sv.children; a.style.width = S.splitMe + "%"; b.style.width = (100 - S.splitMe) + "%";
      a.textContent = S.splitMe >= 15 ? `${S.names.me} ${S.splitMe}%` : ""; b.textContent = 100 - S.splitMe >= 15 ? `${S.names.partner} ${100 - S.splitMe}%` : ""; }
  }
  if (el.dataset.act === "band"){
    const x = Number(el.value);
    [S.model, S.baseModel].forEach(m => { m.band.low = x; });
    save();
    const big = document.getElementById("thbig"); if (big) big.textContent = Math.round(x*100) + "%";
    const q = document.getElementById("thq"); if (q) q.textContent = previewText(x);
    const oc = document.getElementById("outcomes"); if (oc) oc.innerHTML = outcomesHTML(x, S.model.band.high);
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "name"){ S.names[el.dataset.v] = el.value.trim() || (el.dataset.v === "me" ? "Person 1" : "Person 2"); save(); render(); }
  if (el.dataset.act === "upload" && el.files[0]) readFile(el.dataset.v, el.files[0]);
  if (el.dataset.act === "txsplit"){ render(); openSheet(el.dataset.id); }
  if (el.dataset.act === "bandtoggle"){ const v = el.checked ? 0.08 : 0.2; [S.model, S.baseModel].forEach(m => { m.band.low = v; }); save(); render(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.innerHTML) closeSheet(); });

/* A newer built-in model replaces the one saved in this browser. Your review threshold is kept;
   weights learned from earlier swipes are reset, since they were tuned to the old model. */
if (!S.baseModel || S.baseModel.version !== BUILTIN_MODEL.version){
  const low = S.model && S.model.band ? S.model.band.low : undefined;
  S.baseModel = deepCopy(BUILTIN_MODEL); S.model = deepCopy(BUILTIN_MODEL);
  if (typeof low === "number"){ S.model.band.low = low; S.baseModel.band.low = low; }
  save();
}
/* The automatic-sharing cutoff isn't a user setting; restore it if an earlier version of the page changed it. */
if (S.model.version === "placeholder"){ S.model.band.high = PLACEHOLDER_MODEL.band.high; S.baseModel.band.high = PLACEHOLDER_MODEL.band.high; save(); }
/* If someone already made a custom category with a built-in name, fold it into the built-in one. */
(S.customGroups || []).slice().forEach(g => {
  const b = BASE_GROUPS.find(x => x.label.toLowerCase() === String(g.label).toLowerCase());
  if (!b) return;
  ["catOverrides", "merchantCat"].forEach(k => { const m = S[k] || {}; Object.keys(m).forEach(key => { if (m[key] === g.id) m[key] = b.id; }); });
  S.customGroups = S.customGroups.filter(x => x !== g);
  save();
});
render();
})();
</script>
</body>
</html>
